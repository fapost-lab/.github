name: Feature request
description: Suggest something the platform should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are welcome, and the ones that get built are almost always the
        ones that start from a concrete problem rather than a solution.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that you cannot do today, and what do you do
        instead? Describe the situation, not the feature — the best solution is
        often not the one either of us thought of first.
      placeholder: |
        We run broadcasts to ~40k contacts. There is no way to see how far one
        has got without querying the database, so we watch Horizon and guess.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you already have a shape in mind, describe it. Optional.

  - type: textarea
    id: alternatives
    attributes:
      label: What you have already tried
      description: >
        Workarounds, other tools, or approaches you rejected — and why they were
        not enough.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flow engine and builder
        - Channels and messaging
        - Assistants
        - Contacts and segments
        - Broadcasts
        - Admin panel
        - Deployment and operations
        - Extending — Solutions and Plugins
        - Documentation
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to build it?
      description: >
        Not expected, and it does not change whether the idea is considered.
        Please open the issue before writing code — the architecture has
        constraints that are not obvious from outside, and finding out in review
        costs a rewrite.
      options:
        - label: I would be willing to work on this
